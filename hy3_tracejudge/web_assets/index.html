<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Hy3 TraceJudge</title>
  <link rel="stylesheet" href="/assets/styles.css">
  <script src="/assets/app.js" defer></script>
</head>
<body>
<main>
  <div class="brand"><div class="mark">H3</div><div><div class="kicker">Rhinoceros Bird Challenge</div><strong>Hy3 TraceJudge</strong></div></div>
  <h1>答案对了，<br>过程真的成立吗？</h1>
  <p class="lead">调用 Hy3 生成完整算法解答；固定测试和 Hypothesis 验证实现，规则与 Hy3 交叉审查逐步定位首错。</p>
  <div class="layout">
    <section class="card controls">
      <div class="label">Service status</div><div class="status"><span id="dot" class="dot"></span><span id="health">正在检查…</span></div>
      <div id="authGroup" hidden>
        <label class="label" for="apiKey">API 访问密钥</label>
        <input id="apiKey" type="password" autocomplete="off" maxlength="512" placeholder="输入 WEB_API_KEY">
        <p class="hint">密钥仅保存在当前浏览器标签页，不会写入页面或服务器日志。</p>
        <button id="checkKey" class="secondary" type="button">保存密钥并检查连接</button>
      </div>
      <label class="label" for="problem">选择要让 Hy3 解答的题目</label>
      <div class="problem-filters">
        <input id="problemSearch" type="search" autocomplete="off" placeholder="搜索题名或题号">
        <select id="difficulty" aria-label="按难度筛选题目">
          <option value="all">全部难度</option>
          <option value="easy">Easy</option>
          <option value="medium">Medium</option>
          <option value="hard">Hard</option>
        </select>
      </div>
      <select id="problem" aria-describedby="problemCount"></select>
      <div id="problemCount" class="hint problem-count"></div>
      <div id="problemMeta" class="problem-meta"></div>
      <div id="statement" class="statement"></div>
      <label class="label" for="examples">Hypothesis 自动测试输入上限</label><input id="examples" type="number" min="1" max="500" value="60">
      <label class="label" for="reviewMode">多 Agent 编排模式</label>
      <select id="reviewMode"><option value="supervisor">Supervisor · 5 专家并行</option><option value="swarm">Bounded Swarm · 冲突仲裁</option><option value="single">Single · 单评审基线</option></select>
      <div id="modeHint" class="hint"></div>
      <button id="run" type="button">调用 Hy3 解答并评估所选题</button>
      <div class="pipeline">
        <div class="pipe">01 · Hy3 生成分步解答</div><div class="pipe">02 · 固定/隐藏用例执行</div><div class="pipe">03 · Hypothesis 搜索最小反例</div><div class="pipe">04 · Supervisor 分派专业 Agent</div><div class="pipe">05 · 汇总证据并定位首错</div>
      </div>
    </section>
    <section id="result" class="card empty"><div><b>等待一次完整评估</b><br>从下拉框选择具体题目，再让 Hy3 生成答案</div></section>
  </div>
</main>
</body>
</html>
